name: Package PhotoCraft fork

on:
  workflow_dispatch:
  push:
    branches:
      - build/photocraft-fork
    paths:
      - ".github/workflows/photocraft-fork.yml"
      - "scripts/build-photocraft-fork.mjs"
      - "vendor/photocraft-fork/**"
      - "public/fonts/**"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      PHOTOCRAFT_BUILD_ROOT: ${{ github.workspace }}/.photocraft-build
      TRUNK: ${{ github.workspace }}/.tools/trunk
      RAYON_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .photocraft-build/source
          cache-all-crates: "true"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Trunk
        run: |
          mkdir -p .tools
          curl -fL --retry 5 --retry-all-errors \
            https://github.com/trunk-rs/trunk/releases/download/v0.22.2/trunk-x86_64-unknown-linux-gnu.tar.gz \
            -o .tools/trunk.tar.gz
          tar -xzf .tools/trunk.tar.gz -C .tools
          .tools/trunk --version

      - name: Build and package fork
        run: npm run photocraft:fork

      - name: Commit packaged runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photocraft
          if git diff --cached --quiet; then
            echo "Packaged runtime is unchanged."
            exit 0
          fi
          git commit -m "chore: package PhotoCraft fork [skip ci]"
          git push origin HEAD:build/photocraft-fork
